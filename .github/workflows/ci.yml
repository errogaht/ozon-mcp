name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fixtures use stock Chrome already supplied by the Ubuntu hosted runner.
      # They intercept site navigation and require neither Ozon login nor an API key.
      - run: /usr/bin/google-chrome --version
      - run: npm run check
      - run: npm test
